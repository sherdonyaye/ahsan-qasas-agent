name: Ahsan Qasas free transcription
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: YouTube playlist or video HTTPS link (blank resumes saved queue)
        required: false
        type: string
      model:
        description: Speech model
        type: choice
        options: [medium, large-v3, small]
        default: medium
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ahsan-qasas-queue
  cancel-in-progress: false
jobs:
  collect:
    # No private-repository runner spending. Scheduled runs require explicit enablement.
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.ENABLE_QASAS_AUTORUN == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Process bounded queue
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          ASR_MODEL: ${{ inputs.model || 'medium' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u cloud.py
      - name: Save progress and text (public repository)
        if: always()
        run: |
          if [ -d state ]; then
            git config user.name 'qasas-agent'
            git config user.email 'qasas-agent@users.noreply.github.com'
            git add state
            if ! git diff --cached --quiet; then
              git commit -m 'Save transcription queue progress'
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahsan-qasas-review
          path: work/Ahsan-Qasas-Review-Export.zip
          retention-days: 7
          if-no-files-found: ignore
